<!DOCTYPE html>
<html lang="es" data-theme="dark" style="color-scheme: dark;"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<title>Shalom Store · Catálogo de Gorras</title>
<style>
:root{--bg:#120b1f;--ink:#ece6ff;--red:#9d5cff;--card:#1c1230;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Montserrat","Helvetica Neue",Arial,sans-serif;padding-bottom:84px}
.wrap{max-width:1100px;margin:0 auto;padding:20px}
header.cover{position:relative;overflow:hidden;border:2px solid var(--ink);padding:20px;min-height:clamp(260px,48vw,440px);display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(135deg,#2b1a52,#120b1f)}
.cover .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover:before{content:"";position:absolute;inset:0;background:linear-gradient(to top,#120b1fe6,#120b1f33 70%);z-index:1}
.cover>div{position:relative;z-index:2}
.cover .side{position:absolute;top:16px;right:14px;writing-mode:vertical-rl;font-size:12px;letter-spacing:.2em;font-weight:700}
.tag{display:inline-block;background:var(--red);color:#fff;font-weight:800;padding:4px 10px;letter-spacing:.08em;font-size:13px}
h1{margin:10px 0 0;font-family:"Knewave","Permanent Marker",Impact,sans-serif;font-size:clamp(56px,14vw,140px);line-height:1;color:var(--red);font-weight:400;text-transform:uppercase}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0;align-items:center}
.bar button,.btn{font:inherit;font-weight:700;font-size:13px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:8px 14px;cursor:pointer;letter-spacing:.05em}
.bar button.on,.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.sp{flex:1}
.soc{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
a.s{display:flex;align-items:center;gap:8px;border:1.5px solid var(--ink);padding:7px 12px;color:var(--ink);text-decoration:none;font-weight:700;font-size:13px}
a.s svg{width:22px;height:22px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#fb [data-dc]{margin-left:6px;opacity:.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{border:1.5px solid var(--ink);background:var(--card);padding:14px;position:relative;display:flex;flex-direction:column;gap:8px}
.card .cat{font-size:11px;font-weight:800;letter-spacing:.15em;color:var(--red)}
.card h3{margin:0;font-family:"Knewave","Permanent Marker",Impact,sans-serif;font-size:28px;line-height:1.1;font-weight:400;text-transform:uppercase}
.art{border:1px solid var(--ink);aspect-ratio:4/3;display:grid;place-items:center;position:relative;overflow:hidden}
.art img{width:100%;height:100%;object-fit:cover}
.meta{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.code{font-size:11px;background:var(--red);color:#fff;padding:2px 8px;width:fit-content;font-weight:800}
.desc{font-size:12px;line-height:1.4;opacity:.85;margin:0}
.low{color:var(--red)}
.agot{position:absolute;top:10px;right:10px;z-index:3;background:var(--bg);border:1.5px solid var(--red);color:var(--red);font-weight:800;font-size:11px;padding:2px 6px;transform:rotate(6deg)}
.adm{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--ink);padding-top:8px}
.adm button{font:inherit;font-size:12px;font-weight:700;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:4px 9px;cursor:pointer}
dialog{border:2px solid var(--ink);background:var(--bg);color:var(--ink);padding:20px;width:min(420px,92vw)}
dialog::backdrop{background:#0007}
label{display:block;font-size:11px;font-weight:800;letter-spacing:.1em;margin:10px 0 3px}
input,select,textarea{width:100%;font:inherit;padding:8px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink)}
.empty{grid-column:1/-1;border:1.5px dashed var(--ink);padding:40px;text-align:center;font-weight:700}
.note{font-size:12px;opacity:.7}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--red);color:#fff;padding:10px 16px;font-weight:700;z-index:99}
#sv{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-top:2px solid var(--red);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;font-weight:700;font-size:13px}
[hidden]{display:none!important}
</style></head><body>
<div class="wrap">
<header class="cover"><img class="bg" id="cbg" alt="" hidden=""><div><span class="tag">SHALOM STORE · CATÁLOGO 2026–2027</span><h1>GORRAS</h1></div><div class="side">INVENTARIO · REFERENCIAS</div></header>
<div class="soc" id="soc1"></div>
<div class="bar" style="margin-bottom:0"><button class="btn red" id="hup" hidden="">+ SUBIR IMAGEN DE PORTADA</button><span class="note" id="hnote"></span><input type="file" id="hfile" accept="image/*" hidden=""></div>
<div class="bar" id="bar"><span id="fb" style="display:contents"></span><span class="sp"></span><span class="note" id="cnt"></span>
<button class="btn" id="addc" hidden="">+ CATEGORÍA</button><button class="btn red" id="add" hidden="">+ NUEVA GORRA</button></div>
<div class="grid" id="grid"></div>
<p class="note" id="mode"></p>
<footer style="text-align:center;margin:34px 0 10px"><a href="#" id="adm" style="font-size:11px;opacity:.45;color:inherit">Administrador</a></footer>
</div>
<div id="sv" hidden=""><span>Tienes cambios sin guardar</span><button class="btn red" id="sok">GUARDAR CAMBIOS</button><button class="btn" id="sno">DESCARTAR</button></div>
<div id="toast" hidden=""></div>
<dialog id="ask"><form method="dialog" style="margin:0"><b id="am"></b><input id="ai" style="margin-top:10px"><div style="display:flex;gap:8px;margin-top:14px"><button class="btn red" value="ok">ACEPTAR</button><button class="btn" value="x" formnovalidate="">CANCELAR</button></div></form></dialog>
<dialog id="dlg"><form method="dialog" id="f" style="margin:0">
<b id="dt">NUEVA GORRA</b>
<label>NOMBRE</label><input id="n" required="">
<label>CATEGORÍA</label><select id="c"><option value="urbana">URBANAS</option><option value="agropecuaria">AGROPECUARIAS</option><option value="new-era">NEW ERA</option></select>
<label>CÓDIGO</label><input id="k">
<label>PRECIO (COP)</label><input id="p" inputmode="numeric" placeholder="Ej: 45.000" autocomplete="off">
<label>STOCK (solo lo ves tú)</label><input id="s" inputmode="numeric" autocomplete="off">
<label>COLOR (escríbelo en HEX o elige)</label><div style="display:flex;gap:8px"><input id="col" type="color" value="#2b1a52" style="width:56px;padding:2px"><input id="colt" placeholder="#7c3aed" maxlength="7" autocomplete="off"></div>
<label>IMAGEN DE LA GORRA</label><input id="img" type="file" accept="image/*"><div id="imgp" class="note"></div>
<canvas id="cv" width="320" height="240" hidden="" style="width:100%;aspect-ratio:4/3;border:1.5px solid var(--ink);touch-action:none;cursor:grab;margin-top:8px"></canvas><input id="zm" type="range" step="0.01" hidden="" style="padding:0">
<label>DESCRIPCIÓN</label><textarea id="d" rows="3"></textarea>
<div style="display:flex;gap:8px;margin-top:14px"><button class="btn red" value="ok">ACEPTAR</button><button class="btn" value="x" formnovalidate="">CANCELAR</button></div>
</form></dialog>

const soc=[["i","@shalom.store__","https://www.instagram.com/shalom.store__"],["f","Shalom Store","https://www.facebook.com/search/top?q=shalom%20store"],["t","@shalom.store12","https://www.tiktok.com/@shalom.store12"],["w","322 921 6460","https://wa.me/573229216460"]];
$("soc1").innerHTML=soc.map(([k,n,u])=>`<a class="s" href="${u}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24">${ic[k]}</svg>${n}</a>`).join("");
const cap=c=>`<svg viewBox="0 0 120 70" width="150" height="88"><path d="M18 46C18 20 40 8 62 8s40 12 40 38z" fill="${esc(c)}" stroke="#c9a8ff" stroke-width="1.5"/><path d="M8 50c20-8 50-8 90 0 4 2 2 8-2 8-30-4-60-4-86 0-4 0-5-6-2-8z" fill="${esc(c)}" stroke="#c9a8ff" stroke-width="1.5"/><circle cx="62" cy="8" r="3" fill="#9d5cff"/></svg>`;
function render(){
 const list=S.caps.filter(i=>filter==="todas"||i.cat===filter);
 $("fb").innerHTML=[{id:"todas",name:"TODAS"},...S.cats].map(c=>`<button data-f="${esc(c.id)}" class="${filter===c.id?"on":""}">${esc(c.name)}${canEdit&&c.id!=="todas"?`<span data-dc="${esc(c.id)}" title="Quitar categoría">✕</span>`:""}</button>`).join("");
 $("cnt").textContent=list.length+" REF."+(canEdit?" · "+list.reduce((a,i)=>a+stOf(i),0)+" UND.":"");
 $("grid").innerHTML=list.length?list.map(i=>{const st=stOf(i);return `<div class="card" data-id="${esc(i.id)}">
 ${i.agot?'<span class="agot">AGOTADA</span>':''}
 <span class="cat">${esc(catName(i.cat))}</span><h3>${esc(i.name)}</h3>
 <div class="art">${i.img?`<img src="${esc(i.img)}" alt="${esc(i.name)}" loading="lazy" decoding="async">`:cap(i.color||"#2b1a52")}</div>
 <span class="code">CÓDIGO · ${esc(i.code||"TBC")}</span>
 <p class="desc">${esc(i.desc)}</p>
 <div class="meta"><span>${fmt(i.price)}</span>${canEdit?`<span class="${st<=3?"low":""}">STOCK: ${st}</span>`:""}</div>
 ${canEdit?`<div class="adm"><button data-a="m">−1</button><button data-a="p">+1</button><button data-a="e">EDITAR</button><button data-a="d">BORRAR</button></div>`:""}
 </div>`}).join(""):`<div class="empty">AÚN NO HAY GORRAS${canEdit?" — AGREGA LA PRIMERA":""}</div>`;
 const im=$("cbg");if(S.cover?.url){im.src=S.cover.url;im.hidden=false}else{im.hidden=true;im.removeAttribute("src")}
 $("hup").textContent=S.cover?.url?"CAMBIAR IMAGEN DE PORTADA":"+ SUBIR IMAGEN DE PORTADA";
 $("hnote").textContent=canEdit&&!S.cover?.url?"Sube tu imagen de portada: las letras quedan por delante.":"";
 $("adm").textContent=canEdit?"Cerrar sesión de administrador":"Administrador";
 $("sv").hidden=!(canEdit&&dirty());
}
$("bar").addEventListener("click",async e=>{const s=e.target.closest("[data-dc]");if(!s)return;e.stopPropagation();const id=s.dataset.dc;
 if(canEdit&&await ask("¿Quitar la categoría "+catName(id)+"? Las gorras que la tengan conservarán el nombre.")){S.cats=S.cats.filter(c=>c.id!==id);if(filter===id)filter="todas";render()}},true);
$("bar").onclick=e=>{const b=e.target.closest("button[data-f]");if(!b)return;filter=b.dataset.f;render()};
$("addc").onclick=async()=>{const n=((await ask("Nombre de la nueva categoría",1))||"").trim().toUpperCase();if(!n)return;
 const id=n.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"c"+Date.now().toString(36);
 if(S.cats.some(c=>c.id===id)){alert("Esa categoría ya existe.");return}
 S.cats.push({id,name:n});render()};
function draw(c){if(!cr)return;const w=c.width,h=c.height,x=c.getContext("2d");x.fillStyle="#1c1230";x.fillRect(0,0,w,h);const s=Math.max(w/cr.img.width,h/cr.img.height)*cr.z;const dw=cr.img.width*s,dh=cr.img.height*s;x.drawImage(cr.img,(w-dw)/2+cr.ox*w,(h-dh)/2+cr.oy*h,dw,dh)}
$("img").onchange=()=>{const f=$("img").files[0],cv=$("cv"),zm=$("zm");if(!f){cr=null;cv.hidden=zm.hidden=true;return}
 const im=new Image();im.onload=()=>{const w=cv.width,h=cv.height,zmin=Math.min(w/im.width,h/im.height)/Math.max(w/im.width,h/im.height);cr={img:im,z:zmin,ox:0,oy:0};zm.min=zmin;zm.max=3;zm.value=zmin;cv.hidden=zm.hidden=false;$("imgp").textContent="Arrastra la foto para moverla y usa la barra para acercar o alejar.";draw(cv)};im.src=URL.createObjectURL(f)};
$("zm").oninput=()=>{if(cr){cr.z=+$("zm").value;draw($("cv"))}};
let dr=null;const cvv=$("cv");
cvv.onpointerdown=e=>{dr={x:e.clientX,y:e.clientY};cvv.setPointerCapture(e.pointerId)};
cvv.onpointermove=e=>{if(!dr||!cr)return;const r=cvv.getBoundingClientRect();cr.ox+=(e.clientX-dr.x)/r.width;cr.oy+=(e.clientY-dr.y)/r.height;dr={x:e.clientX,y:e.clientY};draw(cvv)};
cvv.onpointerup=cvv.onpointercancel=()=>{dr=null};
$("p").oninput=e=>{const d=e.target.value.replace(/\D/g,"");e.target.value=d?Number(d).toLocaleString("es-CO"):""};
const hx=v=>{v=v.trim().replace(/^#?/,"#");if(/^#[0-9a-f]{3}$/i.test(v))v="#"+[...v.slice(1)].map(c=>c+c).join("");return /^#[0-9a-f]{6}$/i.test(v)?v.toLowerCase():null};
$("col").oninput=()=>{$("colt").value=$("col").value};
$("colt").oninput=()=>{const h=hx($("colt").value);if(h)$("col").value=h};
function open(it){editing=it||null;cr=null;$("cv").hidden=$("zm").hidden=true;$("dt").textContent=it?"EDITAR GORRA":"NUEVA GORRA";
 $("n").value=it?.name||"";$("c").innerHTML=S.cats.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("");if(it?.cat)$("c").value=it.cat;
 $("k").value=it?.code||"";$("p").value=it?.price!=null?Number(it.price).toLocaleString("es-CO"):"";$("s").value=it?String(stOf(it)):"";
 $("col").value=it?.color||"#2b1a52";$("colt").value=$("col").value;$("d").value=it?.desc||"";$("img").value="";$("imgp").textContent=it?.img?"Ya tiene imagen. Elige otra solo si quieres cambiarla.":"";$("dlg").showModal()}
$("add").onclick=()=>open();
$("f").onsubmit=e=>{if(e.submitter?.value!=="ok")return;
 const old=editing||{},id=old.id||"c"+Date.now().toString(36);let img=old.img||"";
 if(cr){const c=document.createElement("canvas");c.width=960;c.height=720;draw(c);if(img.startsWith("imagenes/"))trash.push(img);img=c.toDataURL("image/jpeg",.85)}
 const n=Math.max(0,parseInt(String($("s").value).replace(/\D/g,""))||0);
 const o={id,name:$("n").value,cat:$("c").value,code:$("k").value,price:parseInt(String($("p").value).replace(/\D/g,""))||0,color:$("col").value,desc:$("d").value,img,agot:n<=0};
 const i=S.caps.findIndex(c=>c.id===id);if(i<0)S.caps.push(o);else S.caps[i]=o;
 stk[id]=n;saveStock();render()};
function setStock(it,n){n=Math.max(0,n);stk[it.id]=n;it.agot=n<=0;saveStock();render()}
$("grid").onclick=async e=>{const b=e.target.closest("button[data-a]");if(!b||!canEdit)return;
 const id=b.closest(".card").dataset.id,it=S.caps.find(x=>x.id===id),a=b.dataset.a;
 if(a==="e")open(it);else if(a==="m")setStock(it,stOf(it)-1);else if(a==="p")setStock(it,stOf(it)+1);
 else if(a==="d"&&await ask("¿Borrar «"+it.name+"»?")){S.caps=S.caps.filter(c=>c.id!==id);if((it.img||"").startsWith("imagenes/"))trash.push(it.img);delete stk[id];saveStock();render()}};
$("hup").onclick=()=>$("hfile").click();
$("hfile").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
 try{const im0=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(f)});
 const k=Math.min(1,1600/im0.width),cc=document.createElement("canvas");cc.width=Math.round(im0.width*k);cc.height=Math.round(im0.height*k);cc.getContext("2d").drawImage(im0,0,0,cc.width,cc.height);
 if((S.cover?.url||"").startsWith("imagenes/"))trash.push(S.cover.url);S.cover={url:cc.toDataURL("image/jpeg",.8)};render()}catch(x){alert("No se pudo cargar la imagen.")}};
$("sno").onclick=async()=>{if(!await ask("¿Descartar todos los cambios sin guardar?"))return;S=JSON.parse(base);trash=[];render()};
$("sok").onclick=async()=>{const b=$("sok");b.disabled=true;b.textContent="GUARDANDO…";
 try{const out=JSON.parse(JSON.stringify(S)),ts=Date.now().toString(36);
  for(const c of out.caps){if((c.img||"").startsWith("data:")){const p=`imagenes/${c.id}-${ts}.jpg`;await put(p,c.img.split(",")[1],"Foto "+c.name);c.img=p}delete c.aid}
  if((out.cover?.url||"").startsWith("data:")){const p=`imagenes/portada-${ts}.jpg`;await put(p,out.cover.url.split(",")[1],"Portada");out.cover={url:p}}
  await put("datos.json",b64(JSON.stringify(out)),"Actualizar catálogo");
  for(const p of trash){try{await del(p)}catch(x){}}
  S=out;base=JSON.stringify(S);trash=[];alert("Guardado. El público lo verá en 1 o 2 minutos.")
 }catch(x){alert("No se pudo guardar: "+(x.message||"error")+". Revisa tu token y tu conexión.")}
 b.disabled=false;b.textContent="GUARDAR CAMBIOS";render()};
async function enter(){
 try{const r=await fetch(`https://api.github.com/repos/${GH.o}/${GH.r}`,{headers:{Authorization:"Bearer "+tok}});const j=await r.json();if(!r.ok||!j.permissions?.push)throw 0;
  canEdit=true;$("add").hidden=$("addc").hidden=$("hup").hidden=false;
  $("mode").textContent="MODO ADMINISTRADOR · los cambios se publican al pulsar GUARDAR CAMBIOS.";
  const d=await gh("GET","datos.json");if(d){S=JSON.parse(unb64(d.content));base=JSON.stringify(S)}
  try{const s=await gh("GET","stock.json",null,GH.s);stk=s?JSON.parse(unb64(s.content)):{}}catch(x){alert("No encuentro el repositorio privado Shalom-stock.")}
  render();return true}catch(x){tok="";canEdit=false;try{localStorage.removeItem("sh_tok")}catch(y){}return false}}
$("adm").onclick=async e=>{e.preventDefault();
 if(canEdit){if(dirty()&&!await ask("Tienes cambios sin guardar. ¿Salir igual?"))return;try{localStorage.removeItem("sh_tok")}catch(x){}location.reload();return}
 const t=((await ask("Pega tu token de administrador",1))||"").trim();if(!t)return;tok=t;
 if(await enter()){try{localStorage.setItem("sh_tok",t)}catch(x){}}else{alert("Token no válido o sin permiso de escritura.");render()}};
$("grid").innerHTML='<div class="empty">CARGANDO…</div>';
const pub=await Promise.race([fetch("datos.json?v="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null),new Promise(r=>setTimeout(()=>r(null),2500))]);
if(pub&&pub.caps){S=pub;base=JSON.stringify(S)}
render();
if(tok)await enter();
})();
